[package]
name = "r3bl-build-infra"
version = "0.0.5"
edition = "2024"
homepage = "https://r3bl.com"
license = "Apache-2.0"
repository = "https://github.com/r3bl-org/r3bl-open-core"
authors = [
    "Nazmul Idris <idris@developerlife.com>",
    "Nadia Idris <nadia@developerlife.com>",
]
documentation = "https://docs.rs/r3bl-build-infra"
readme = "README.md"
description = """
Developer tools and utilities for Rust projects. cargo-rustdoc-fmt: lossless CST-based \
rustdoc formatter that aligns Markdown tables, converts inline links to sorted \
reference-style links, auto-links technical terms, and normalizes code fences \
(supporting whole-workspace, git-diff, and surgical --lines range formatting).\
"""
# At most 5 keywords w/ no spaces, each has max length of 20 char.
keywords = ["rustdoc", "markdown", "formatter", "cargo-subcommand", "documentation"]
categories = ["development-tools", "command-line-utilities"]

# https://blog.rust-lang.org/2026/04/04/docsrs-only-default-targets/
[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[lints]
workspace = true

# Define binary entry points (add more [[bin]] sections for future tools)
[[bin]]
name = "cargo-rustdoc-fmt"
path = "src/bin/cargo-rustdoc-fmt.rs"

# Library definition
[lib]
name = "r3bl_build_infra"
path = "src/lib.rs"

[dependencies]
r3bl_tui = { path = "../tui", version = "0.7.7" }
tokio = { version = "1.48.0", features = ["full"] }
clap = { version = "4.5.51", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.17"
json5 = "1.3"
walkdir = "2.5"
unicode-width = "0.2"
rustc-hash = "2.1.0"

[dev-dependencies]
test-case = "3.3.1"
tempfile = "3.23"
