# Pins the Rust nightly toolchain bundle (`rustc`, `cargo`, `rustfmt`, `clippy`, `rustdoc`).
# Nightly is required across the workspace for:
# 1. Unstable `rustc` language features (`custom_inner_attributes`, `adt_const_params`,
#    `associated_type_defaults`, `test`)
# 2. Unstable `rustfmt.toml` options (`wrap_comments`, `imports_granularity`, `group_imports`, etc.)
# 3. Parallel frontend thread tuning (`-Z unstable-options --jobs-frontend=8` in `.cargo/config.toml`;
#    enabled by default at 2 threads since `nightly-2026-11-14`:
#    https://blog.rust-lang.org/2026/11/16/enabling-parallel-frontend-on-nightly/)
[toolchain]
channel = "nightly-2026-11-16"
components = ["rust-src", "rust-analyzer", "llvm-tools"]
